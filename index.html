<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2f3b45; --muted:#6b7a86; --green:#6cc070; --green2:#57a35b; --pink:#f28bb3; --purple:#6a7be8; --purple2:#5a6bd8; --lav:#e6e9ff; --card:#f6f8fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font:17px/1.45 "Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-weight:600; min-height:100dvh; display:flex; flex-direction:column; }
  main { flex:1; display:flex; flex-direction:column; padding:28px 22px; max-width:440px; margin:0 auto; width:100%; }
  .screen { display:none; } .screen.on { display:flex; flex-direction:column; min-height:calc(100dvh - 90px); }
  .top { text-align:center; padding-top:30px; }
  h1 { font-size:32px; line-height:1.12; margin:0 0 8px; font-weight:900; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:18px; margin:0 0 10px; font-weight:600; }
  .alias { font-weight:900; color:var(--ink); }
  .stage { flex:1; display:grid; place-items:center; position:relative; min-height:240px; }
  .bottom { padding-bottom:12px; }
  input { width:100%; padding:15px 16px; border-radius:16px; border:2px solid #e6ebef; background:#fff; color:var(--ink); font:inherit; font-size:17px; margin:0 0 14px; text-align:center; }
  input:focus { outline:none; border-color:var(--purple); }
  button { width:100%; padding:17px; border:0; border-radius:18px; font:inherit; font-size:19px; font-weight:900; color:#fff; background:var(--purple); margin:0 0 12px; box-shadow:0 5px 0 var(--purple2); letter-spacing:.01em; }
  button.link.inline { padding:2px 8px; margin:0; font-size:18px; vertical-align:baseline; }
  button.link { width:auto; display:inline-block; background:transparent; color:var(--purple2); box-shadow:none; padding:10px 14px; font-size:16px; margin-top:8px; }
  button.secondary { background:#fff; color:var(--muted); box-shadow:0 5px 0 #e6ebef; border:2px solid #e6ebef; }
  button:active { transform:translateY(3px); box-shadow:none; }
  button:disabled { opacity:.45; box-shadow:none; transform:none; }
  .status { font-size:15px; color:var(--muted); min-height:1.4em; text-align:center; }
  .err { color:#d64a5a; font-size:14px; margin-top:8px; min-height:1.2em; text-align:center; }
  footer { text-align:center; color:#9aa7b1; font-size:12px; padding:12px; }
  /* welcome: big character, flat */
  .hero { font-size:120px; line-height:1; filter:drop-shadow(0 12px 12px rgba(0,0,0,.12)); position:relative; z-index:1; }
  /* waiting: character bobs, dots bounce */
  .bob { animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(-4deg); } 50% { transform:translateY(-16px) rotate(4deg); } }
  .dots { display:flex; gap:10px; justify-content:center; margin-top:18px; }
  .dots i { width:12px; height:12px; border-radius:50%; background:var(--purple); animation:bounce 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,100% { transform:translateY(0); opacity:.5; } 50% { transform:translateY(-10px); opacity:1; } }
  .avatar { width:150px; height:150px; border-radius:50%; background:#f1f3ff; object-fit:cover; }
  .hero-img { position:relative; z-index:1; filter:drop-shadow(0 12px 12px rgba(0,0,0,.12)); }
  .faces img { width:64px; height:64px; border-radius:50%; background:#fff; margin:0 6px; }
  /* waiting: full-screen crowd, drifting */
  .screen.crowd.on { position:fixed; inset:0; display:flex; flex-direction:column; padding:28px 22px; overflow:hidden; }
  .crowd-field { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .crowd-track { position:absolute; top:0; left:0; height:100%; width:200%; animation:drift 60s linear infinite; will-change:transform; }
  @keyframes drift { from { transform:translateX(-50%); } to { transform:translateX(0); } }
  .crowd-track img { position:absolute; width:64px; height:64px; border-radius:50%; opacity:1; animation:floaty var(--d,8s) ease-in-out infinite; animation-delay:var(--delay,0s); filter:drop-shadow(0 6px 6px rgba(0,0,0,.08)); will-change:transform; }
  @keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
  .over { position:relative; z-index:2; }
  .panel { background:rgba(255,255,255,.86); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-radius:24px; padding:22px 20px; text-align:center; box-shadow:0 14px 40px rgba(47,59,69,.14); max-width:360px; }
  .panel h1 { margin-bottom:6px; }

  /* load screen */
  .splash { position:fixed; inset:0; z-index:100; background:#fff; display:grid; place-items:center; transition:opacity .45s ease; }
  .splash.out { opacity:0; pointer-events:none; }
  .splash { overflow:hidden; }
  .splash img { width:150vw; max-width:none; height:auto;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%); }
  @media (min-width:700px) { .splash img { width:min(150vw, 930px); } }
  /* faux push notification */
  .toast { position:fixed; top:calc(env(safe-area-inset-top) + 12px); left:12px; right:12px; z-index:50; display:flex; gap:14px; align-items:center;
           background:#fff; color:var(--ink); border-radius:20px; padding:14px 16px; box-shadow:0 18px 50px rgba(0,0,0,.28); transform:translateY(-140%); transition:transform .35s cubic-bezier(.2,.9,.3,1.2); }
  .toast.show { transform:translateY(0); }
  .toast[hidden] { display:none; }
  .toast img { width:56px; height:56px; border-radius:50%; flex:none; }
  .toast-t { font-weight:900; font-size:18px; } .toast-s { color:var(--muted); font-size:15px; }
  .purple .arrived { background:#fff; color:var(--purple2); border-radius:20px; padding:16px; text-align:center; font-weight:900; font-size:20px; margin:0 0 14px; animation:popin .5s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes popin { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  /* purple screens (match, booth) */
  .screen.purple.on { position:fixed; inset:0; background:var(--purple); color:#fff; padding:20px 22px calc(env(safe-area-inset-bottom) + 16px); overflow-y:auto; display:flex; flex-direction:column; }
  .purple .stage { min-height:150px; }
  .purple .top { padding-top:18px; }
  .purple button { padding:15px; margin-bottom:10px; }
  .purple .sub, .purple .status { color:rgba(255,255,255,.85); }
  .purple .alias { color:#fff; }
  .purple .card { background:rgba(255,255,255,.14); color:#fff; }
  .purple .card .loc { color:rgba(255,255,255,.8); }
  .purple button { background:var(--lav); color:var(--purple2); box-shadow:0 5px 0 #b9c0f0; }
  .purple button.secondary { background:transparent; color:#fff; border:0; box-shadow:none; font-weight:800; }
  .purple .err { color:#ffd3d8; }
  .confetti { position:absolute; inset:0; pointer-events:none; }
  .confetti i { position:absolute; width:12px; height:12px; transform:rotate(45deg); border-radius:2px; opacity:.95; }
  .pair { display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; z-index:1; }
  .pair .heart { font-size:44px; line-height:1; }
  .pair .names { font-size:22px; font-weight:800; text-align:center; }
  .pair .faces { font-size:64px; line-height:1; letter-spacing:.2em; }
  .card { background:var(--card); border-radius:22px; padding:18px 20px; margin:0 0 14px; text-align:center; }
  .card .where { font-size:20px; font-weight:900; }
  .card .loc { color:var(--muted); }
</style>
</head>
<body>
<div id="splash" class="splash"><img id="splash-v" alt="pop" src="media/pop-intro.gif"></div>
<div id="toast" class="toast" hidden><img id="toast-av" alt=""><div><div class="toast-t" id="toast-t"></div><div class="toast-s" id="toast-s"></div></div></div>
<main>
  <!-- 1. Welcome -->
  <section id="s-welcome" class="screen">
    <div class="top">
      <h1>Meet someone new<br>at a booth!</h1>
      <div class="sub">Tonight you're <span class="alias" id="w-alias">…</span> <button type="button" class="link inline" id="w-shuffle-name">↻</button></div>
    </div>
    <div class="stage"><div style="text-align:center"><img class="avatar hero-img" id="w-avatar" alt=""><div><button type="button" class="link" id="w-shuffle">↻ New look</button></div></div></div>
    <div class="bottom">
      <input id="w-name" placeholder="Your name (optional)" autocomplete="off">
      <div class="status" style="margin:-6px 0 12px">If you add a name, your match sees it instead of your nickname.</div>
      <button id="w-go">Enter the mix</button>
      <div class="err" id="w-err"></div>
    </div>
  </section>

  <!-- 2. Waiting: a full-screen crowd drifting left to right, you in the middle -->
  <section id="s-wait" class="screen crowd">
    <div class="crowd-field" id="crowd"><div class="crowd-track" id="crowd-track"></div></div>
    <div class="stage over">
      <div class="panel">
        <h1>Finding someone…</h1>
        <div class="sub">You're <span class="alias" id="wt-alias"></span>. <span id="wt-status"></span></div>
        <div class="status" id="wt-pool"></div>
        <div class="err" id="wt-err"></div>
      </div>
    </div>
    <img id="wt-mascot" alt="" style="display:none">
  </section>

  <!-- 3. Match found (purple) -->
  <section id="s-card" class="screen purple">
    <div class="confetti">
      <i style="left:8%;top:9%;background:#7be07f"></i><i style="left:28%;top:6%;background:#ff5c9a"></i><i style="left:55%;top:11%;background:#ffb347"></i>
      <i style="left:80%;top:7%;background:#7be07f"></i><i style="left:93%;top:12%;background:#ffb347"></i><i style="left:42%;top:19%;background:#ffb347"></i>
      <i style="left:68%;top:14%;background:#ff5c9a"></i><i style="left:24%;top:22%;background:#ff5c9a"></i><i style="left:64%;top:23%;background:#4fd8ff"></i>
      <i style="left:12%;top:30%;background:#4fd8ff"></i><i style="left:88%;top:28%;background:#7be07f"></i>
    </div>
    <div class="top">
      <h1 id="c-title">You matched!</h1>
      <div class="sub" id="c-status">Both of you have to say yes.</div>
    </div>
    <div class="stage">
      <div class="pair">
        <div class="heart">✨</div>
        <div class="names" id="c-names"></div>
        <div class="faces" id="c-faces"></div>
      </div>
    </div>
    <div class="bottom">
      <div class="card">
        <div class="where" id="c-vendor"></div>
        <div class="loc" id="c-loc"></div>
      </div>
      <button id="c-yes">I'm in!</button>
      <button id="c-pass" class="secondary">Pass, find another</button>
      <div class="err" id="c-err"></div>
    </div>
  </section>

  <!-- 4. At the booth (purple) -->
  <section id="s-booth" class="screen purple">
    <div class="confetti">
      <i style="left:8%;top:9%;background:#7be07f"></i><i style="left:28%;top:6%;background:#ff5c9a"></i><i style="left:55%;top:11%;background:#ffb347"></i>
      <i style="left:80%;top:7%;background:#7be07f"></i><i style="left:93%;top:12%;background:#ffb347"></i><i style="left:42%;top:19%;background:#ffb347"></i>
      <i style="left:68%;top:14%;background:#ff5c9a"></i><i style="left:24%;top:22%;background:#ff5c9a"></i><i style="left:64%;top:23%;background:#4fd8ff"></i>
      <i style="left:12%;top:30%;background:#4fd8ff"></i><i style="left:88%;top:28%;background:#7be07f"></i>
    </div>
    <div class="top">
      <h1 id="b-title">It's on!</h1>
      <div class="sub" id="b-sub">Head over and say hi.</div>
    </div>
    <div class="stage">
      <div class="pair">
        <div class="names" id="b-names"></div>
        <div class="faces" id="b-faces"></div>
      </div>
    </div>
    <div class="bottom">
      <div class="card">
        <div class="where" id="b-vendor"></div>
        <div class="loc" id="b-loc"></div>
      </div>
      <button id="b-self">I'm at the booth</button>
      <button id="b-partner">My match showed up</button>
      <div class="status" id="b-status"></div>
      <button id="b-again" class="secondary">Find someone new</button>
      <div class="err" id="b-err"></div>
    </div>
  </section>
</main>
<footer>Pop · anonymous · nothing persists after tonight</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const cfg = window.POP_CONFIG;
  const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const $ = id => document.getElementById(id);
  const show = name => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $('s-' + name).classList.add('on'); };
  const TIMEOUT_MS = 10 * 60 * 1000, POLL_MS = 3000;
  const ANIMAL = { Otter:'🦦', Heron:'🪶', Lynx:'🐱', Falcon:'🦅', Fox:'🦊', Badger:'🦡', Ibis:'🦩', Marten:'🐾', Puffin:'🐧', Stoat:'🐿️', Wren:'🐦', Yak:'🐂' };
  const emojiFor = alias => ANIMAL[(alias || '').split(' ').pop()] || '🫧';
  const AV = 'https://api.dicebear.com/9.x/adventurer/svg?backgroundColor=ffb347,ff5c9a,7be07f,4fd8ff,b388ff,ffe066&backgroundType=solid&radius=50&seed=';
  const avatarFor = seed => AV + encodeURIComponent(seed || 'stranger');
  // the crowd: a jittered grid of generic faces, duplicated once so the drift wraps seamlessly
  (function buildCrowd() {
    const track = $('crowd-track'); const cols = 5, rows = 7, N = cols * rows;
    const rnd = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
    for (let half = 0; half < 2; half++) {
      for (let i = 0; i < N; i++) {
        const c = i % cols, r = Math.floor(i / cols);
        const im = document.createElement('img'); im.alt = ''; im.src = avatarFor('crowd-' + i);
        im.style.left = (half * 50 + (c + 0.15 + rnd(i, 1) * 0.7) * (50 / cols)) + '%';
        im.style.top = ((r + 0.1 + rnd(i, 2) * 0.8) * (100 / rows)) + '%';
        im.style.setProperty('--d', (6 + rnd(i, 3) * 6).toFixed(1) + 's');
        im.style.setProperty('--delay', (-rnd(i, 4) * 8).toFixed(1) + 's');
        im.dataset.i = i; track.appendChild(im);
      }
    }
  })();
  let me = null, match = null, pollTimer = null, cardTimer = null;

  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw new Error(error.message); return data; };
  const stopPolls = () => { clearInterval(pollTimer); clearTimeout(cardTimer); pollTimer = cardTimer = null; };
  const err = (id, e) => { $(id).textContent = e ? (e.message || String(e)) : ''; };

  // ---- identity: anonymous session persisted in this browser ----
  async function session() {
    let { data: { session } } = await sb.auth.getSession();
    if (!session) ({ data: { session } } = await sb.auth.signInAnonymously());
    if (!session) throw new Error('could not sign in');
    return session;
  }

  // ---- 1. welcome ----
  async function boot() {
    try {
      await session();
      // already joined on this device? then jump straight back in
      const { data: rows } = await sb.from('people').select('*').limit(1);
      if (rows && rows[0]) { me = rows[0]; return search(); }
      shuffle(); shuffleName();
      show('welcome');
    } catch (e) { show('welcome'); err('w-err', e); }
  }
  let mySeed = null, myAlias = null;
  const ADJ = ['Neon','Velvet','Copper','Lunar','Amber','Indigo','Mossy','Scarlet','Golden','Cobalt','Pearl','Ember'];
  const ANIMALS = ['Otter','Heron','Lynx','Falcon','Fox','Badger','Ibis','Marten','Puffin','Stoat','Wren','Yak'];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function shuffle() { mySeed = 'av-' + Math.random().toString(36).slice(2, 10); $('w-avatar').src = avatarFor(mySeed); }
  function shuffleName() { myAlias = pick(ADJ) + ' ' + pick(ANIMALS); $('w-alias').textContent = myAlias; }
  $('w-shuffle').onclick = shuffle; $('w-shuffle-name').onclick = shuffleName;
  $('w-go').onclick = async () => {
    $('w-go').disabled = true; err('w-err');
    try { me = await rpc('join_event', { p_name: $('w-name').value || null, p_avatar: mySeed, p_alias: myAlias }); search(); }
    catch (e) { err('w-err', e); $('w-go').disabled = false; }
  };

  // ---- 2. waiting / search ----
  async function search() {
    stopPolls(); match = null;
    $('wt-alias').textContent = (me.name || me.alias); $('wt-mascot').src = avatarFor(me.avatar_seed || me.alias); $('wt-status').textContent = me.variant === 'A' ? 'We\'ll pair you with someone else in the mix.' : 'Finding you a booth.';
    show('wait');
    const tick = async () => {
      try {
        const m = await rpc('find_match');
        if (m && m.id) { stopPolls(); match = m; return card(); }
        const n = await rpc('pool_size');            // includes you
        const others = Math.max(0, (n || 1) - 1);
        $('wt-pool').textContent = others === 0 ? 'You\'re the first one here. Hang tight.' : (others === 1 ? '1 other person is nearby.' : others + ' other people are nearby.');
      } catch (e) { err('wt-err', e); }
    };
    await tick();
    if (!match) pollTimer = setInterval(tick, POLL_MS);
  }

  // ---- 3. the card ----
  async function card() {
    err('c-err'); $('c-yes').disabled = false;
    const c = await rpc('match_card', { p_match: match.id });
    renderCard(c);
    show('card');
    // if nobody acts in 10 minutes, time out and go back to the mix
    cardTimer = setTimeout(async () => { try { await rpc('respond_to_match', { p_match: match.id, p_action: 'timed_out' }); } catch (_) {} search(); }, TIMEOUT_MS);
    // watch the partner's answer
    pollTimer = setInterval(async () => {
      try {
        const c2 = await rpc('match_card', { p_match: match.id });
        const other = c2.my_slot === 1 ? c2.status_2 : c2.status_1;
        const mine  = c2.my_slot === 1 ? c2.status_1 : c2.status_2;
        if (other === 'passed' || other === 'timed_out') { $('c-status').textContent = 'They passed. Finding someone else…'; return setTimeout(search, 1200); }
        if (mine === 'confirmed' && (other === 'confirmed' || c2.partner_alias == null)) { stopPolls(); return booth(c2); }
        if (mine === 'confirmed') $('c-status').textContent = 'You\'re in. Waiting for ' + c2.partner_alias + '…';
      } catch (e) { err('c-err', e); }
    }, POLL_MS);
  }
  function renderCard(c) {
    const mine = me.name || me.alias, theirs = c.partner_alias;
    $('c-title').textContent = theirs ? 'You matched!' : 'Head to the booth!';
    $('c-names').textContent = theirs ? (mine + ' & ' + theirs) : mine;
    $('c-faces').innerHTML = ''; [me.avatar_seed || me.alias].concat(theirs ? [c.partner_avatar || theirs] : []).forEach(s => { const im = document.createElement('img'); im.src = avatarFor(s); im.alt = ''; $('c-faces').appendChild(im); });
    $('c-vendor').textContent = c.vendor_name; $('c-loc').textContent = c.vendor_location;
    $('c-status').textContent = theirs ? 'Both of you have to say yes.' : '';
  }
  $('c-yes').onclick = async () => {
    $('c-yes').disabled = true; err('c-err');
    try {
      const m = await rpc('respond_to_match', { p_match: match.id, p_action: 'confirmed' });
      const solo = !m.person_2;
      if (solo || (m.status_1 === 'confirmed' && m.status_2 === 'confirmed')) { stopPolls(); booth(await rpc('match_card', { p_match: match.id })); }
      else $('c-status').textContent = 'You\'re in. Waiting for your match…';
    } catch (e) { err('c-err', e); $('c-yes').disabled = false; }
  };
  $('c-pass').onclick = async () => {
    err('c-err');
    try { await rpc('respond_to_match', { p_match: match.id, p_action: 'passed' }); } catch (e) { return err('c-err', e); }
    search();
  };

  // ---- 4. at the booth ----
  let arrivedShown = false;
  function announceArrival(c) {
    if (arrivedShown) return; arrivedShown = true;
    $('b-sub').textContent = c.partner_alias + ' is at the booth waiting for you!';
    $('b-title').textContent = c.partner_alias + ' is here!';
    const card = document.createElement('div'); card.className = 'arrived'; card.textContent = '📍 ' + c.partner_alias + ' is at ' + c.vendor_name + ' now';
    $('s-booth').querySelector('.bottom').prepend(card);
    $('toast-av').src = avatarFor(c.partner_avatar || c.partner_alias); $('toast-t').textContent = c.partner_alias + ' is at the booth';
    $('toast-s').textContent = 'Waiting for you at ' + c.vendor_name; $('toast').hidden = false; requestAnimationFrame(() => $('toast').classList.add('show'));
    try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (_) {}
    setTimeout(() => { $('toast').classList.remove('show'); setTimeout(() => $('toast').hidden = true, 400); }, 8000);
  }
  function booth(c) {
    stopPolls(); arrivedShown = false;
    document.querySelectorAll('#s-booth .arrived').forEach(n => n.remove());
    const mine = me.name || me.alias, theirs = c.partner_alias;
    $('b-names').textContent = theirs ? (mine + ' & ' + theirs) : mine;
    $('b-faces').innerHTML = ''; [me.avatar_seed || me.alias].concat(theirs ? [c.partner_avatar || theirs] : []).forEach(s => { const im = document.createElement('img'); im.src = avatarFor(s); im.alt = ''; $('b-faces').appendChild(im); });
    if (theirs) {
      const note = () => rpc('match_card', { p_match: match.id }).then(c2 => { if (c2.partner_self_at) announceArrival(c2); }).catch(() => {});
      note(); pollTimer = setInterval(note, POLL_MS);
    }
    $('b-title').textContent = theirs ? ('It\'s on with ' + theirs + '!') : 'It\'s on!';
    $('b-vendor').textContent = c.vendor_name; $('b-loc').textContent = c.vendor_location;
    $('b-partner').style.display = theirs ? '' : 'none';
    $('b-self').disabled = !!c.self_at; $('b-partner').disabled = !!c.partner_at;
    $('b-status').textContent = ''; err('b-err'); $('b-sub').textContent = theirs ? 'Head over and say hi. We\'ll tell you when they arrive.' : 'Head over and say hi.';
    show('booth');
  }
  $('b-self').onclick = async () => { try { await rpc('check_in', { p_match: match.id, p_kind: 'self' }); $('b-self').disabled = true; $('b-status').textContent = 'Checked in. Your match will see that you\'re here.'; } catch (e) { err('b-err', e); } };
  $('b-partner').onclick = async () => { try { await rpc('check_in', { p_match: match.id, p_kind: 'partner' }); $('b-partner').disabled = true; $('b-status').textContent = 'Nice. Thanks for confirming.'; } catch (e) { err('b-err', e); } };
  $('b-again').onclick = async () => { try { await rpc('respond_to_match', { p_match: match.id, p_action: 'passed' }); } catch (_) {} search(); };

  // load screen: hide once the letters have landed (~2.2s) or the clip ends, and the app is ready; tap skips
  const splashDone = new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    // restart the GIF from frame one on every load, then give it time to finish
    const im = $('splash-v'); im.src = 'media/pop-intro.gif?t=' + Date.now();
    const start = () => setTimeout(fin, 2300);
    if (im.complete) start(); else { im.onload = start; im.onerror = fin; }
    setTimeout(fin, 4000); $('splash').addEventListener('click', fin);
  });
  Promise.all([splashDone, boot()]).finally(() => { $('splash').classList.add('out'); setTimeout(() => $('splash').remove(), 500); });
})();
</script>
</body>
</html>
