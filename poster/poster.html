<style>

  .page { width:8.5in; height:11in; position:relative; margin:0 auto; overflow:hidden; }

  .av { position:absolute; width:.95in; height:.95in; border-radius:50%; }
  .foot { position:absolute; bottom:1.1in; left:0; right:0; text-align:center; font-size:.42in; font-weight:700; }
  .url { position:absolute; bottom:.6in; left:0; right:0; text-align:center; font-size:.26in; color:#6b7a86; }
