<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2f3b45; --muted:#6b7a86; --green:#6cc070; --green2:#57a35b; --pink:#f28bb3; --purple:#6a7be8; --purple2:#5a6bd8; --blue:#318bcf; --blue2:#2873ab; --lav:#e6e9ff; --card:#f6f8fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font:17px/1.45 "Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-weight:600; min-height:100dvh; display:flex; flex-direction:column; }
  main { flex:1; display:flex; flex-direction:column; padding:28px 22px; max-width:440px; margin:0 auto; width:100%; }
  .screen { display:none; } .screen.on { display:flex; flex-direction:column; min-height:calc(100dvh - 56px); }
  .top { text-align:center; padding-top:30px; }
  h1 { font-size:32px; line-height:1.12; margin:0 0 8px; font-weight:900; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:18px; margin:0 0 10px; font-weight:600; }
  .alias { font-weight:900; color:var(--ink); }
  .stage { flex:1; display:grid; place-items:center; position:relative; min-height:240px; }
  .bottom { padding-bottom:12px; }
  input { width:100%; padding:15px 16px; border-radius:16px; border:2px solid #e6ebef; background:#fff; color:var(--ink); font:inherit; font-size:17px; margin:0 0 14px; text-align:center; }
  input:focus { outline:none; border-color:var(--blue); }
  button { width:100%; padding:17px; border:0; border-radius:18px; font:inherit; font-size:19px; font-weight:900; color:#fff; background:var(--blue); margin:0 0 12px; box-shadow:0 5px 0 var(--blue2); letter-spacing:.01em; }
  button.link.inline { padding:2px 8px; margin:0; font-size:18px; vertical-align:baseline; }
  button.link { width:auto; display:inline-block; background:transparent; color:var(--blue2); box-shadow:none; padding:10px 14px; font-size:16px; margin-top:8px; }
  button.secondary { background:#fff; color:var(--muted); box-shadow:0 5px 0 #e6ebef; border:2px solid #e6ebef; }
  button:active { transform:translateY(3px); box-shadow:none; }
  button:disabled { opacity:.45; box-shadow:none; transform:none; }
  .status { font-size:15px; color:var(--muted); min-height:1.4em; text-align:center; }
  .err { color:#d64a5a; font-size:14px; margin-top:8px; min-height:1.2em; text-align:center; }
  footer { text-align:center; color:#9aa7b1; font-size:12px; padding:12px; }
  /* welcome: big character, flat */
  .hero { font-size:120px; line-height:1; filter:drop-shadow(0 12px 12px rgba(0,0,0,.12)); position:relative; z-index:1; }
  /* waiting: character bobs, dots bounce */
  .bob { animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(-4deg); } 50% { transform:translateY(-16px) rotate(4deg); } }
  .dots { display:flex; gap:10px; justify-content:center; margin-top:18px; }
  .dots i { width:12px; height:12px; border-radius:50%; background:var(--blue); animation:bounce 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,100% { transform:translateY(0); opacity:.5; } 50% { transform:translateY(-10px); opacity:1; } }
  .avatar { width:150px; height:150px; border-radius:50%; background:#f1f3ff; object-fit:cover; }
  .hero-img { position:relative; z-index:1; filter:drop-shadow(0 12px 12px rgba(0,0,0,.12)); }
  .faces img { width:64px; height:64px; border-radius:50%; background:#fff; margin:0 6px; }
  /* waiting: full-screen crowd, drifting */
  .screen.crowd.on { position:fixed; inset:0; display:flex; flex-direction:column; padding:28px 22px; overflow:hidden; }
  .crowd-field { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .crowd-track { position:absolute; top:0; left:0; height:100%; width:200%; animation:drift 60s linear infinite; will-change:transform; }
  @keyframes drift { from { transform:translateX(-50%); } to { transform:translateX(0); } }
  .crowd-track img { position:absolute; width:64px; height:64px; border-radius:50%; opacity:1; animation:floaty var(--d,8s) ease-in-out infinite; animation-delay:var(--delay,0s); filter:drop-shadow(0 6px 6px rgba(0,0,0,.08)); will-change:transform; }
  @keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }
  .over { position:relative; z-index:2; }
  .panel { background:rgba(255,255,255,.86); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-radius:24px; padding:22px 20px; text-align:center; box-shadow:0 14px 40px rgba(47,59,69,.14); max-width:360px; }
  .panel h1 { margin-bottom:6px; }

  /* welcome */
  .brand { position:absolute; top:calc(env(safe-area-inset-top) + 16px); left:18px; display:flex; align-items:flex-start; gap:2px; z-index:3; }
  .w-logo { width:88px; height:auto; display:block; }
  .tm { font-size:11px; font-weight:800; color:var(--muted); line-height:1; margin-top:2px; }
  #s-welcome { position:relative; padding-top:calc(env(safe-area-inset-top) + 64px); }
  #s-welcome .stage { padding:0 0 12px; }
  .fakecaret { position:absolute; top:50%; width:2px; height:24px; margin-top:-12px; background:var(--ink); animation:blink 1.05s steps(1) infinite; pointer-events:none; }
  @keyframes blink { 50% { opacity:0; } }
  .namebox input::placeholder { color:#b3bcc4; font-weight:800; }
  .sticker { position:relative; display:inline-block; overflow:visible; padding:24px; margin:-24px; cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  .sticker:active { transform:scale(.96); }
  .dice { position:absolute; z-index:3; right:40px; bottom:54px; font-size:40px; line-height:1; transform:rotate(-14deg);
          filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff)
                  drop-shadow(0 5px 6px rgba(47,59,69,.30)); }
  .dice.roll { animation:roll .5s cubic-bezier(.3,1.4,.5,1); }
  @keyframes roll { from { transform:rotate(-14deg) scale(.8); } to { transform:rotate(346deg) scale(1); } }
  .sticker.wiggle .w-hero { animation:wiggle .7s ease-in-out; }
  @keyframes wiggle { 0%,100% { transform:rotate(0); } 20% { transform:rotate(-7deg); } 40% { transform:rotate(6deg); } 60% { transform:rotate(-4deg); } 80% { transform:rotate(2deg); } }
  @media (prefers-reduced-motion: reduce) { .sticker.wiggle .w-hero { animation:none; } }
  .w-hero { display:block; margin:-24px auto; padding:24px; box-sizing:content-box; width:230px; height:230px; background:none; border-radius:0;
            will-change:transform; transform:translateZ(0);
            filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
                    drop-shadow(0 10px 12px rgba(47,59,69,.28)); }
  .namebox { position:relative; margin:0 0 14px; }
  .hint { font-size:14px; color:var(--muted); text-align:left; margin:0 0 6px 4px; }
  .namebox input { margin:0; padding-right:52px; font-weight:800; font-size:19px; text-align:left; }
  .namebox button { position:absolute; right:6px; top:50%; transform:translateY(-50%); }
  .back { position:absolute; top:calc(env(safe-area-inset-top) + 14px); left:14px; z-index:4; width:auto; padding:10px 16px; margin:0; font-size:16px; background:rgba(255,255,255,.9); color:var(--ink); box-shadow:0 4px 14px rgba(0,0,0,.10); border-radius:999px; }
  /* waitlist */
  /* front door: big logo, one line, one button */
  #s-intro.on { min-height:calc(100dvh - 56px); }
  #s-intro .mid { flex:1; }
  /* the logo sits exactly where the intro animation leaves it (placed by placeIntro) */
  #s-intro .i-logo { position:fixed; height:auto; display:block; z-index:2; }
  #s-intro .tag { position:fixed; left:0; right:0; padding:0 24px; color:var(--muted); font-size:19px; font-weight:800; text-align:center; z-index:2; }
  #s-intro .bottom { text-align:center; position:relative; z-index:3; }
  /* Join the mix: words + a bouncing arrow, not a second big button */
  button.cta-down { width:auto; display:inline-flex; flex-direction:column; align-items:center; gap:8px; background:transparent; box-shadow:none; color:var(--blue2); font-size:21px; padding:8px 24px; margin:0 0 10px; }
  button.cta-down:active { transform:none; }
  .cta-down .chev { width:46px; height:46px; border-radius:50%; background:var(--blue); display:grid; place-items:center; box-shadow:0 4px 0 var(--blue2); animation:nudge 1.6s ease-in-out infinite; }
  .cta-down .chev svg { width:22px; height:22px; }
  @keyframes nudge { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }
  #s-welcome.rise { animation:rise .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform:translateY(60px); opacity:0; } to { transform:none; opacity:1; } }
  button.link#i-bring { display:block; margin:6px auto 0; color:var(--muted); font-weight:800; font-size:15px; }
  .sheet-bg { position:fixed; inset:0; background:rgba(20,24,40,.35); z-index:60; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:61; background:#fff; border-radius:24px 24px 0 0; padding:10px 22px calc(env(safe-area-inset-bottom) + 20px);
           max-width:480px; margin:0 auto; box-shadow:0 -10px 40px rgba(0,0,0,.18); animation:sheetup .3s cubic-bezier(.2,.9,.3,1); }
  @keyframes sheetup { from { transform:translateY(100%); } to { transform:translateY(0); } }
  .sheet .grab { width:40px; height:5px; border-radius:3px; background:#d9dee3; margin:0 auto 14px; }
  .sheet .x { position:absolute; top:12px; right:12px; width:36px; height:36px; padding:0; margin:0; border-radius:50%; background:#f0f3f6; color:var(--muted); box-shadow:none; font-size:22px; line-height:36px; font-weight:800; }
  .sheet .x:active { transform:none; background:#e4e9ee; }
  .sheet.dragging { transition:none; }
  .sheet.leaving { transition:transform .22s ease-in; }
  .sheet h2 { font-size:24px; font-weight:900; margin:0 0 14px; text-align:center; }
  .roles { display:flex; gap:8px; margin:0 0 12px; }
  .roles button { flex:1; margin:0; padding:11px 4px; font-size:15px; background:#fff; color:var(--ink); border:2px solid #e6ebef; box-shadow:none; }
  .roles button.on { border-color:var(--blue); color:var(--blue2); background:#eef6fc; }
  .sheet textarea { width:100%; padding:14px 16px; border-radius:16px; border:2px solid #e6ebef; font:inherit; font-size:16px; margin:0 0 14px; resize:none; color:var(--ink); }
  .sheet textarea:focus { outline:none; border-color:var(--blue); }
  /* load screen */
  .splash { position:fixed; inset:0; z-index:100; background:#fff; display:grid; place-items:center; transition:opacity .45s ease; }
  .splash.out { opacity:0; pointer-events:none; }
  .splash { overflow:hidden; }
  .splash img { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:130vw; max-width:none; height:auto;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%); }
  @media (min-width:700px) { .splash img { width:min(130vw, 820px); } }
  /* purple screens: logo + paired stickers */
  .purple .brand .w-logo { filter: drop-shadow(0 4px 6px rgba(20,24,60,.35)); }
  .purple .brand .tm { color:rgba(255,255,255,.85); }
  .screen.purple .top { padding-top:calc(env(safe-area-inset-top) + 70px); }
  .screen.purple .stage { flex:1 0 auto; min-height:230px; }
  .duo { display:flex; align-items:flex-start; justify-content:center; gap:0; position:relative; }
  .duo .who { display:flex; flex-direction:column; align-items:center; width:150px; animation:popin .55s cubic-bezier(.2,1.5,.4,1) both; }
  .duo .who:nth-child(1) { transform-origin:bottom right; animation-delay:.05s; }
  .duo .who:nth-child(3) { transform-origin:bottom left; animation-delay:.18s; }
  .duo .who img { width:140px; height:140px;
                  filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 10px 12px rgba(20,24,60,.30)); }
  .duo .who:nth-child(1) img { transform:rotate(-7deg); }
  .duo .who:nth-child(3) img { transform:rotate(7deg); }
  .duo .who span { margin-top:2px; font-weight:900; font-size:17px; color:#fff; text-align:center; line-height:1.15; }
  .duo .shake { font-size:44px; line-height:1; align-self:center; margin:-30px -14px 0; z-index:2; transform:rotate(-12deg);
                animation:popin .5s .32s cubic-bezier(.2,1.6,.4,1) both;
                filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 5px 6px rgba(20,24,60,.30)); }
  /* faux push notification */
  .toast { position:fixed; top:calc(env(safe-area-inset-top) + 12px); left:12px; right:12px; z-index:50; display:flex; gap:14px; align-items:center;
           background:#fff; color:var(--ink); border-radius:20px; padding:14px 16px; box-shadow:0 18px 50px rgba(0,0,0,.28); transform:translateY(-140%); transition:transform .35s cubic-bezier(.2,.9,.3,1.2); }
  .toast.show { transform:translateY(0); }
  .toast[hidden] { display:none; }
  .toast img { width:56px; height:56px; border-radius:50%; flex:none; }
  .toast-t { font-weight:900; font-size:18px; } .toast-s { color:var(--muted); font-size:15px; }
  .purple .arrived { background:#fff; color:var(--purple2); border-radius:20px; padding:16px; text-align:center; font-weight:900; font-size:20px; margin:0 0 14px; animation:popin .5s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes popin { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  /* purple screens (match, booth) */
  .screen.purple.on { position:fixed; inset:0; background:var(--purple); color:#fff; padding:20px 22px calc(env(safe-area-inset-bottom) + 16px); overflow-y:auto; display:flex; flex-direction:column; }
  .purple .stage { min-height:150px; }
  .purple .top { padding-top:18px; }
  .purple button { padding:15px; margin-bottom:10px; }
  .purple .sub, .purple .status { color:rgba(255,255,255,.85); }
  .purple .alias { color:#fff; }
  .purple .card { background:rgba(255,255,255,.14); color:#fff; }
  .purple .card .loc { color:rgba(255,255,255,.8); }
  .purple button { background:var(--lav); color:var(--purple2); box-shadow:0 5px 0 #b9c0f0; }
  .purple button.secondary { background:transparent; color:#fff; border:0; box-shadow:none; font-weight:800; }
  .purple .err { color:#ffd3d8; }
  .rain { position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .screen.purple .top, .screen.purple .stage, .screen.purple .bottom, .screen.purple .brand { position:relative; z-index:1; }
  .screen.purple .brand { position:absolute; z-index:4; }
  /* booth screen: fit on one phone screen without scrolling */
  #s-booth .top { padding-top:calc(env(safe-area-inset-top) + 56px); }
  #s-booth h1 { font-size:27px; margin-bottom:4px; }
  #s-booth .sub { font-size:16px; margin-bottom:0; }
  #s-booth .stage { min-height:175px; }
  #s-booth .duo .who { width:124px; }
  #s-booth .duo .who img { width:112px; height:112px; }
  #s-booth .duo .shake { font-size:36px; margin-top:-24px; }
  #s-booth .card { padding:12px 16px; margin-bottom:10px; }
  #s-booth .arrived { padding:12px; font-size:17px; margin-bottom:10px; }
  #s-booth #b-status { min-height:0; margin:0 0 4px; }
  #s-booth #b-again { padding:8px; margin:0; font-size:16px; }
  .rain i { position:absolute; top:-30px; display:block; opacity:.95; animation:fall var(--dur) var(--delay) cubic-bezier(.3,.1,.6,1) forwards; }
  .rain i.sq { width:11px; height:11px; border-radius:2px; }
  .rain i.strip { width:6px; height:16px; border-radius:2px; }
  .rain i.dot { width:10px; height:10px; border-radius:50%; }
  .rain i.tri { width:14px; height:12px; clip-path:polygon(50% 0, 100% 100%, 0 100%); }
  .rain i.sq2 { width:20px; height:10px; background:none !important; border:3px solid var(--c); border-radius:10px 10px 0 0; border-bottom:0; }
  @keyframes fall { 0% { transform:translate(0,0) rotate(0); opacity:1; }
                    85% { opacity:.9; }
                    100% { transform:translate(var(--dx), calc(100vh + 60px)) rotate(var(--rot)); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .rain i { animation:none; display:none; } }
  .confetti i { position:absolute; width:12px; height:12px; transform:rotate(45deg); border-radius:2px; opacity:.95; }
  .pair { display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; z-index:1; }
  .pair .heart { font-size:44px; line-height:1; }
  .pair .names { font-size:22px; font-weight:800; text-align:center; }
  .pair .faces { font-size:64px; line-height:1; letter-spacing:.2em; }
  .card { background:var(--card); border-radius:22px; padding:18px 20px; margin:0 0 14px; text-align:center; }
  .card .where { font-size:20px; font-weight:900; }
  .card .loc { color:var(--muted); }
</style>
</head>
<body>
<div id="splash" class="splash"><img id="splash-v" alt="pop" src="media/pop-intro.gif"></div>
<div id="toast" class="toast" hidden><img id="toast-av" alt=""><div><div class="toast-t" id="toast-t"></div><div class="toast-s" id="toast-s"></div></div></div>
<main>
  <!-- 0. Front door: logo, tagline, Join the mix; organizers find the waitlist here -->
  <section id="s-intro" class="screen">
    <div class="mid"><img class="i-logo" id="i-logo" src="media/pop-logo-header.png" alt="pop"><div class="tag" id="i-tag">Your next friend is one booth away.</div></div>
    <div class="bottom">
      <button type="button" class="cta-down" id="i-go">Join the mix<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></span></button>
      <button type="button" class="link bring" id="i-bring">Running an event? Bring Pop!</button>
    </div>
  </section>

  <!-- 1. Welcome: logo on top, avatar as the star, name pre-filled, one button -->
  <section id="s-welcome" class="screen">
    <div class="brand" id="w-brand"><img class="w-logo" id="w-logo" src="media/pop-logo-header.png" alt="pop"><span class="tm">™</span></div>
    <div class="stage"><div class="sticker" id="w-shuffle" role="button" tabindex="0" aria-label="Change your look"><img class="avatar hero-img w-hero" id="w-avatar" alt=""><span class="dice" id="w-tapme" aria-hidden="true">🎲</span></div></div>
    <div class="bottom">
      <div class="hint">This is the name others will see.</div>
      <div class="namebox"><input id="w-name" autocomplete="off" aria-label="Your name"><span class="fakecaret" id="w-caret"></span><button type="button" class="link inline" id="w-shuffle-name" aria-label="New nickname">↻</button></div>
      <button id="w-go">Find my match</button>
      <div class="err" id="w-err"></div>
    </div>
  </section>

  <!-- 2. Waiting: a full-screen crowd drifting left to right, you in the middle -->
  <section id="s-wait" class="screen crowd">
    <div class="crowd-field" id="crowd"><div class="crowd-track" id="crowd-track"></div></div>
    <button type="button" class="back" id="wt-back" aria-label="Back">‹ Back</button>
    <div class="stage over">
      <div class="panel">
        <h1>Finding someone…</h1>
        <div class="sub">You're <span class="alias" id="wt-alias"></span>. <span id="wt-status"></span></div>
        <div class="status" id="wt-pool"></div>
        <div class="err" id="wt-err"></div>
      </div>
    </div>
    <img id="wt-mascot" alt="" style="display:none">
  </section>

  <!-- 3. Match found (purple) -->
  <section id="s-card" class="screen purple">
    <div class="brand"><img class="w-logo" src="media/pop-logo-header.png" alt="pop"><span class="tm">™</span></div>
    <div class="rain" aria-hidden="true"></div>
    <div class="top">
      <h1 id="c-title">You matched!</h1>
      <div class="sub" id="c-status">Both of you have to say yes.</div>
    </div>
    <div class="stage">
      <div class="pair">
        <div class="duo" id="c-faces"></div>
        <div class="names" id="c-names" hidden></div>
      </div>
    </div>
    <div class="bottom">
      <div class="card">
        <div class="where" id="c-vendor"></div>
        <div class="loc" id="c-loc"></div>
      </div>
      <button id="c-yes">Accept</button>
      <button id="c-pass" class="secondary">Pass, find another</button>
      <div class="err" id="c-err"></div>
    </div>
  </section>

  <!-- 4. At the booth (purple) -->
  <section id="s-booth" class="screen purple">
    <div class="brand"><img class="w-logo" src="media/pop-logo-header.png" alt="pop"><span class="tm">™</span></div>
    <div class="rain" aria-hidden="true"></div>
    <div class="top">
      <h1 id="b-title">It's on!</h1>
      <div class="sub" id="b-sub">Head over and say hi.</div>
    </div>
    <div class="stage">
      <div class="pair">
        <div class="duo" id="b-faces"></div>
        <div class="names" id="b-names" hidden></div>
      </div>
    </div>
    <div class="bottom">
      <div class="card">
        <div class="where" id="b-vendor"></div>
        <div class="loc" id="b-loc"></div>
      </div>
      <button id="b-self">I'm at the booth</button>
      <div class="status" id="b-status"></div>
      <button id="b-again" class="secondary">Find someone new</button>
      <div class="err" id="b-err"></div>
    </div>
  </section>
</main>
<div class="sheet-bg" id="wl-bg" hidden></div>
<div class="sheet" id="wl" hidden role="dialog" aria-modal="true" aria-labelledby="wl-title">
  <div class="grab"></div><button type="button" class="x" id="wl-x" aria-label="Close">×</button>
  <div id="wl-form">
    <h2 id="wl-title">Bring Pop to your event</h2>
    <div class="roles" id="wl-roles">
      <button type="button" data-role="organizer" class="on">Organizer</button><button type="button" data-role="vendor">Vendor</button><button type="button" data-role="attendee">Attendee</button>
    </div>
    <input id="wl-email" type="email" inputmode="email" autocomplete="email" placeholder="Your email">
    <textarea id="wl-note" rows="3" placeholder="Tell us about your event (optional)"></textarea>
    <button id="wl-go">Join the waitlist</button>
    <div class="err" id="wl-err"></div>
  </div>
  <div id="wl-done" hidden><h2>Thanks!</h2><p class="sub">We'll be in touch.</p><button id="wl-close">Done</button></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const cfg = window.POP_CONFIG;
  const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const $ = id => document.getElementById(id);
  const show = name => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $('s-' + name).classList.add('on'); 
    const purple = $('s-' + name).classList.contains('purple');
    setChrome(purple ? '#6a7be8' : '#ffffff');
    if (purple) rain($('s-' + name).querySelector('.rain'));
  };
  // Safari picks its top/bottom bar color from the page and the theme-color tag; replacing the tag (not editing it) and a tiny scroll make it re-read
  let chromeColor = null;
  function setChrome(col) { /* page stays white; purple screens extend under Safari's bars instead */ }
  const CONF = ['#7be07f', '#ff5c9a', '#ffb347', '#4fd8ff', '#ffe066', '#ffffff'];
  const SHAPES = ['sq', 'strip', 'strip', 'dot', 'tri', 'sq2'];
  function rain(box) {
    if (!box) return; box.innerHTML = '';
    for (let i = 0; i < 42; i++) {
      const p = document.createElement('i'); const c = CONF[i % CONF.length];
      p.className = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      p.style.background = c; p.style.setProperty('--c', c);
      p.style.left = (Math.random() * 100) + '%';
      p.style.setProperty('--dx', ((Math.random() - .5) * 80).toFixed(0) + 'px');
      p.style.setProperty('--rot', ((Math.random() < .5 ? -1 : 1) * (360 + Math.random() * 540)).toFixed(0) + 'deg');
      p.style.setProperty('--dur', (2.4 + Math.random() * 1.8).toFixed(2) + 's');
      p.style.setProperty('--delay', (Math.random() * 1.2).toFixed(2) + 's');
      box.appendChild(p);
    }
    setTimeout(() => { if (box) box.innerHTML = ''; }, 5500);
  }
  const TIMEOUT_MS = 10 * 60 * 1000, POLL_MS = 3000;
  const ANIMAL = { Otter:'🦦', Heron:'🪶', Lynx:'🐱', Falcon:'🦅', Fox:'🦊', Badger:'🦡', Ibis:'🦩', Marten:'🐾', Puffin:'🐧', Stoat:'🐿️', Wren:'🐦', Yak:'🐂' };
  const emojiFor = alias => ANIMAL[(alias || '').split(' ').pop()] || '🫧';
  // hairstyles whose artwork stays inside the frame (8 of 45 run off the edge and look boxed as stickers)
  const HAIR = 'long01,long02,long03,long04,long05,long07,long08,long10,long11,long12,long13,long14,long15,long19,long20,long21,long23,long24,long25,long26,short01,short02,short03,short04,short05,short06,short07,short08,short09,short10,short11,short12,short13,short14,short17,short18,short19';
  const AV = 'https://api.dicebear.com/9.x/adventurer/svg?hair=' + HAIR + '&backgroundColor=cfe5f6,ffd4d0,fbd2e1,fff0b3&backgroundType=solid&radius=50&seed=';
  const avatarFor = seed => AV + encodeURIComponent(seed || 'stranger');
  function renderDuo(el, c) {
    const mine = me.name || me.alias, theirs = c.partner_alias;
    const who = (seed, name) => { const d = document.createElement('div'); d.className = 'who';
      const im = document.createElement('img'); im.alt = ''; im.src = avatarBare(seed); const s = document.createElement('span'); s.textContent = name;
      d.append(im, s); return d; };
    el.innerHTML = ''; el.append(who(me.avatar_seed || me.alias, mine));
    if (theirs) { const hs = document.createElement('div'); hs.className = 'shake'; hs.textContent = '🤝'; el.append(hs, who(c.partner_avatar || theirs, theirs)); }
  }
  const avatarBare = seed => 'https://api.dicebear.com/9.x/adventurer/svg?hair=' + HAIR + '&seed=' + encodeURIComponent(seed || 'stranger');   // no background, for the sticker look
  // the crowd: a jittered grid of generic faces, duplicated once so the drift wraps seamlessly
  (function buildCrowd() {
    const track = $('crowd-track'); const cols = 5, rows = 7, N = cols * rows;
    const rnd = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
    for (let half = 0; half < 2; half++) {
      for (let i = 0; i < N; i++) {
        const c = i % cols, r = Math.floor(i / cols);
        const im = document.createElement('img'); im.alt = ''; im.src = avatarFor('crowd-' + i);
        im.style.left = (half * 50 + (c + 0.15 + rnd(i, 1) * 0.7) * (50 / cols)) + '%';
        im.style.top = ((r + 0.1 + rnd(i, 2) * 0.8) * (100 / rows)) + '%';
        im.style.setProperty('--d', (6 + rnd(i, 3) * 6).toFixed(1) + 's');
        im.style.setProperty('--delay', (-rnd(i, 4) * 8).toFixed(1) + 's');
        im.dataset.i = i; track.appendChild(im);
      }
    }
  })();
  let me = null, match = null, pollTimer = null, cardTimer = null;

  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw new Error(error.message); return data; };
  const stopPolls = () => { clearInterval(pollTimer); clearTimeout(cardTimer); pollTimer = cardTimer = null; };
  const err = (id, e) => { $(id).textContent = e ? (e.message || String(e)) : ''; };

  // ---- identity: anonymous session persisted in this browser ----
  async function session() {
    let { data: { session } } = await sb.auth.getSession();
    if (!session) ({ data: { session } } = await sb.auth.signInAnonymously());
    if (!session) throw new Error('could not sign in');
    return session;
  }

  // ---- 1. welcome ----
  async function boot() {
    try {
      await session();
      // already joined on this device? then jump straight back in
      const { data: rows } = await sb.from('people').select('*').limit(1);
      if (rows && rows[0]) { me = rows[0]; return search(); }
      shuffle(); shuffleName();
      show('intro');
    } catch (e) { shuffle(); shuffleName(); show('intro'); err('w-err', e); }
  }
  let mySeed = null, myAlias = null;
  const ADJ = ['Neon','Velvet','Copper','Lunar','Amber','Indigo','Mossy','Scarlet','Golden','Cobalt','Pearl','Ember'];
  const ANIMALS = ['Otter','Heron','Lynx','Falcon','Fox','Badger','Ibis','Marten','Puffin','Stoat','Wren','Yak'];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function shuffle() { mySeed = 'av-' + Math.random().toString(36).slice(2, 10); $('w-avatar').src = avatarBare(mySeed); }
  function shuffleName() { myAlias = pick(ADJ) + ' ' + pick(ANIMALS); $('w-name').placeholder = myAlias; placeCaret(); }
  // a blinking cursor at the start of the empty box, so it's clear you can type (phones won't focus a field until tapped)
  function placeCaret() {
    const inp = $('w-name'), c = $('w-caret'); if (!inp || !c) return;
    const cs = getComputedStyle(inp); c.style.left = (parseFloat(cs.paddingLeft) + inp.offsetLeft + 1) + 'px';
    c.style.display = (inp.value || document.activeElement === inp) ? 'none' : 'block';
  }
  ['input','focus','blur'].forEach(ev => $('w-name').addEventListener(ev, placeCaret));
  window.addEventListener('resize', placeCaret);
  // nudge: wiggle the sticker now and then until it's tapped once; the bubble goes away after the first tap
  let tapped = false, wiggleTimer = null;
  function wiggle() { const s = $('w-shuffle'); if (tapped || !s) return; s.classList.remove('wiggle'); void s.offsetWidth; s.classList.add('wiggle'); }
  function startNudge() { if (tapped) return; clearInterval(wiggleTimer); setTimeout(wiggle, 400); wiggleTimer = setInterval(wiggle, 4500); }
  $('w-shuffle').onclick = () => { shuffle(); const d = $('w-tapme'); d.classList.remove('roll'); void d.offsetWidth; d.classList.add('roll');
    if (!tapped) { tapped = true; clearInterval(wiggleTimer); } };
  $('w-shuffle').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('w-shuffle').onclick(); } };
  $('w-shuffle-name').onclick = shuffleName;
  // waitlist sheet
  let wlRole = 'organizer', wlSource = 'welcome';
  function openWaitlist(role, source) {
    wlRole = role; wlSource = source; err('wl-err');
    document.querySelectorAll('#wl-roles button').forEach(b => b.classList.toggle('on', b.dataset.role === role));
    $('wl-note').placeholder = role === 'organizer' ? 'Tell us about your event (optional)' : 'Anything you want us to know (optional)';
    $('wl-form').hidden = false; $('wl-done').hidden = true; $('wl-bg').hidden = false; $('wl').hidden = false;
  }
  function closeWaitlist() {
    const sh = $('wl'); if (sh.hidden) return;
    sh.classList.remove('dragging'); sh.classList.add('leaving'); sh.style.transform = 'translateY(100%)';
    setTimeout(() => { sh.hidden = true; $('wl-bg').hidden = true; sh.classList.remove('leaving'); sh.style.transform = ''; }, 220);
  }
  // pull the sheet down to close it (from anywhere except while typing in a field)
  (() => {
    const sh = $('wl'); let y0 = null, dy = 0, t0 = 0;
    sh.addEventListener('touchstart', e => {
      if (e.target.closest('input, textarea')) return;
      y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); sh.classList.add('dragging');
    }, { passive: true });
    sh.addEventListener('touchmove', e => {
      if (y0 === null) return;
      dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`;
      if (dy > 0) e.preventDefault();
    }, { passive: false });
    sh.addEventListener('touchend', () => {
      if (y0 === null) return; y0 = null; sh.classList.remove('dragging');
      const fast = dy > 30 && dy / Math.max(1, Date.now() - t0) > 0.5;
      if (dy > sh.offsetHeight * 0.25 || fast) closeWaitlist();
      else { sh.classList.add('leaving'); sh.style.transform = ''; setTimeout(() => sh.classList.remove('leaving'), 220); }
    });
  })();
  $('i-bring').onclick = () => openWaitlist('organizer', 'welcome');
  // Join the mix: the big logo shrinks into the corner as the avatar screen comes in
  // the intro animation is a square, 130vw wide (max 820px on big screens), centered; the logo lands at these fractions of it
  function placeIntro() {
    const W = innerWidth, H = innerHeight, g = W >= 700 ? Math.min(1.3 * W, 820) : 1.3 * W;
    const left = W / 2 - g / 2 + g * 0.1872, top = H / 2 - g / 2 + g * 0.2962, width = g * 0.6372;
    const L = $('i-logo'); Object.assign(L.style, { left: left + 'px', top: top + 'px', width: width + 'px' });
    $('i-tag').style.top = (top + width * 584 / 900 + 14) + 'px';
  }
  placeIntro(); window.addEventListener('resize', placeIntro);
  // swipe up on the front screen does the same as tapping Join the mix
  let swipeY = null;
  $('s-intro').addEventListener('touchstart', e => { swipeY = e.touches[0].clientY; }, { passive: true });
  $('s-intro').addEventListener('touchend', e => { if (swipeY !== null && swipeY - e.changedTouches[0].clientY > 50) $('i-go').onclick(); swipeY = null; });
  $('i-go').onclick = () => {
    if (!$('s-intro').classList.contains('on')) return;
    const from = $('i-logo').getBoundingClientRect();
    show('welcome'); placeCaret();
    const w = $('s-welcome'); w.classList.remove('rise'); void w.offsetWidth; w.classList.add('rise');
    flyLogo(from, $('w-logo'), () => setTimeout(startNudge, 300));
  };
  $('wl-bg').onclick = closeWaitlist; $('wl-close').onclick = closeWaitlist; $('wl-x').onclick = closeWaitlist;
  document.querySelectorAll('#wl-roles button').forEach(b => b.onclick = () => openWaitlist(b.dataset.role, wlSource));
  $('wl-go').onclick = async () => {
    const email = $('wl-email').value.trim(); err('wl-err');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err('wl-err', 'Please enter a valid email.');
    $('wl-go').disabled = true;
    try { await session(); await rpc('join_waitlist', { p_email: email, p_role: wlRole, p_note: $('wl-note').value || null, p_source: wlSource });
          $('wl-form').hidden = true; $('wl-done').hidden = false; }
    catch (e) { err('wl-err', e); }
    finally { $('wl-go').disabled = false; }
  };
  $('wt-back').onclick = async () => {
    stopPolls(); try { await rpc('leave_pool'); } catch (_) {}
    mySeed = me.avatar_seed || me.alias; $('w-avatar').src = avatarBare(mySeed);
    myAlias = me.alias; $('w-name').placeholder = myAlias; $('w-name').value = me.name || '';
    $('w-go').disabled = false; err('w-err'); show('welcome'); placeCaret();
  };
  $('w-go').onclick = async () => {
    $('w-go').disabled = true; err('w-err');
    const typed = $('w-name').value.trim();
    const ownName = typed && typed !== myAlias ? typed : null;   // empty box = keep the nickname; anything typed is their name
    try {
      me = me ? await rpc('update_profile', { p_name: ownName, p_avatar: mySeed, p_alias: myAlias })
              : await rpc('join_event', { p_name: ownName, p_avatar: mySeed, p_alias: myAlias });
      search();
    }
    catch (e) { err('w-err', e); $('w-go').disabled = false; }
  };

  // ---- 2. waiting / search ----
  async function search() {
    stopPolls(); match = null;
    $('wt-alias').textContent = (me.name || me.alias); $('wt-mascot').src = avatarFor(me.avatar_seed || me.alias); $('wt-status').textContent = me.variant === 'A' ? 'We\'ll pair you with someone else in the mix.' : 'Finding you a booth.';
    show('wait');
    const tick = async () => {
      try {
        const m = await rpc('find_match');
        if (m && m.id) { stopPolls(); match = m; return card(); }
        const n = await rpc('pool_size');            // includes you
        const others = Math.max(0, (n || 1) - 1);
        $('wt-pool').textContent = others === 0 ? 'You\'re the first one here. Hang tight.' : (others === 1 ? '1 other person is nearby.' : others + ' other people are nearby.');
      } catch (e) { err('wt-err', e); }
    };
    await tick();
    if (!match) pollTimer = setInterval(tick, POLL_MS);
  }

  // ---- 3. the card ----
  async function card() {
    err('c-err'); $('c-yes').disabled = false;
    const c = await rpc('match_card', { p_match: match.id });
    renderCard(c);
    show('card');
    // if nobody acts in 10 minutes, time out and go back to the mix
    cardTimer = setTimeout(async () => { try { await rpc('respond_to_match', { p_match: match.id, p_action: 'timed_out' }); } catch (_) {} search(); }, TIMEOUT_MS);
    // watch the partner's answer
    pollTimer = setInterval(async () => {
      try {
        const c2 = await rpc('match_card', { p_match: match.id });
        const other = c2.my_slot === 1 ? c2.status_2 : c2.status_1;
        const mine  = c2.my_slot === 1 ? c2.status_1 : c2.status_2;
        if (other === 'passed' || other === 'timed_out') { $('c-status').textContent = 'They passed. Finding someone else…'; return setTimeout(search, 1200); }
        if (mine === 'confirmed' && (other === 'confirmed' || c2.partner_alias == null)) { stopPolls(); return booth(c2); }
        if (mine === 'confirmed') $('c-status').textContent = 'You\'re in. Waiting for ' + c2.partner_alias + '…';
      } catch (e) { err('c-err', e); }
    }, POLL_MS);
  }
  function renderCard(c) {
    const mine = me.name || me.alias, theirs = c.partner_alias;
    $('c-title').textContent = theirs ? 'You matched!' : 'Head to the booth!';
    renderDuo($('c-faces'), c);
    $('c-vendor').textContent = c.vendor_name; $('c-loc').textContent = c.vendor_location;
    $('c-status').textContent = theirs ? 'Both of you have to say yes.' : '';
  }
  $('c-yes').onclick = async () => {
    $('c-yes').disabled = true; err('c-err');
    try {
      const m = await rpc('respond_to_match', { p_match: match.id, p_action: 'confirmed' });
      const solo = !m.person_2;
      if (solo || (m.status_1 === 'confirmed' && m.status_2 === 'confirmed')) { stopPolls(); booth(await rpc('match_card', { p_match: match.id })); }
      else $('c-status').textContent = 'You\'re in. Waiting for your match…';
    } catch (e) { err('c-err', e); $('c-yes').disabled = false; }
  };
  $('c-pass').onclick = async () => {
    err('c-err');
    try { await rpc('respond_to_match', { p_match: match.id, p_action: 'passed' }); } catch (e) { return err('c-err', e); }
    search();
  };

  // ---- 4. at the booth ----
  let arrivedShown = false;
  function announceArrival(c) {
    if (arrivedShown) return; arrivedShown = true;
    $('b-sub').textContent = c.partner_alias + ' is at the booth waiting for you!';
    $('b-title').textContent = c.partner_alias + ' is here!';
    const card = document.createElement('div'); card.className = 'arrived'; card.textContent = '📍 ' + c.partner_alias + ' is at ' + c.vendor_name + ' now';
    $('s-booth').querySelector('.bottom').prepend(card);
    $('toast-av').src = avatarFor(c.partner_avatar || c.partner_alias); $('toast-t').textContent = c.partner_alias + ' is at the booth';
    $('toast-s').textContent = 'Waiting for you at ' + c.vendor_name; $('toast').hidden = false; requestAnimationFrame(() => $('toast').classList.add('show'));
    try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (_) {}
    setTimeout(() => { $('toast').classList.remove('show'); setTimeout(() => $('toast').hidden = true, 400); }, 8000);
  }
  function booth(c) {
    stopPolls(); arrivedShown = false;
    document.querySelectorAll('#s-booth .arrived').forEach(n => n.remove());
    const mine = me.name || me.alias, theirs = c.partner_alias;
    renderDuo($('b-faces'), c);
    if (theirs) {
      const note = () => rpc('match_card', { p_match: match.id }).then(c2 => { if (c2.partner_self_at) announceArrival(c2); }).catch(() => {});
      note(); pollTimer = setInterval(note, POLL_MS);
    }
    $('b-title').textContent = theirs ? ('It\'s on with ' + theirs + '!') : 'It\'s on!';
    $('b-vendor').textContent = c.vendor_name; $('b-loc').textContent = c.vendor_location;
    $('b-self').disabled = !!c.self_at;
    $('b-status').textContent = ''; err('b-err'); $('b-sub').textContent = theirs ? 'Head over and say hi. We\'ll tell you when they arrive.' : 'Head over and say hi.';
    show('booth');
  }
  $('b-self').onclick = async () => { try { await rpc('check_in', { p_match: match.id, p_kind: 'self' }); $('b-self').disabled = true; $('b-status').textContent = 'Checked in. Your match will see that you\'re here.'; } catch (e) { err('b-err', e); } };
  $('b-again').onclick = async () => { try { await rpc('respond_to_match', { p_match: match.id, p_action: 'passed' }); } catch (_) {} search(); };

  // load screen: hide once the letters have landed (~2.2s) or the clip ends, and the app is ready; tap skips
  const splashDone = new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    // restart the GIF from frame one on every load, then give it time to finish
    const im = $('splash-v'); im.src = 'media/pop-intro.gif?t=' + Date.now();
    const start = () => setTimeout(fin, 2000);
    if (im.complete) start(); else { im.onload = start; im.onerror = fin; }
    setTimeout(fin, 4000); $('splash').addEventListener('click', fin);
  });
  // move a copy of the logo from one box to where `target` sits, then reveal target (and its ™ if it has one)
  function flyLogo(from, target, done) {
    const to = target.getBoundingClientRect(), tm = target.parentElement.querySelector('.tm');
    const fly = document.createElement('img'); fly.src = 'media/pop-logo-header.png'; fly.alt = '';
    Object.assign(fly.style, { position:'fixed', left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height:'auto', margin:0,
      zIndex: 101, transformOrigin: '0 0', transition: 'transform .7s cubic-bezier(.65,0,.25,1)' });
    document.body.appendChild(fly); target.style.visibility = 'hidden'; if (tm) { tm.style.transition = ''; tm.style.opacity = 0; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fly.style.transform = `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${to.width / from.width})`;
    }));
    setTimeout(() => { target.style.visibility = ''; if (tm) { tm.style.transition = 'opacity .3s'; tm.style.opacity = 1; } fly.remove(); if (done) done(); }, 760);
  }
  function endSplash() {
    const sp = $('splash'), gif = $('splash-v');
    const target = $('s-intro').classList.contains('on') ? $('i-logo') : $('s-welcome').classList.contains('on') ? $('w-logo') : null;
    if (!target) { sp.classList.add('out'); setTimeout(() => sp.remove(), 500); return; }
    // where the landed logo sits inside the animation's square (measured from the clip)
    const g = gif.getBoundingClientRect();
    const from = { left: g.left + g.width * 0.1872, top: g.top + g.height * 0.2962, width: g.width * 0.6372 };
    gif.style.visibility = 'hidden'; sp.classList.add('out');
    flyLogo(from, target, () => sp.remove());
  }
  Promise.all([splashDone, boot()]).finally(() => { placeCaret(); endSplash(); if ($('s-welcome').classList.contains('on')) setTimeout(startNudge, 700); });
})();
</script>
