<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pop</title>
<style>
  :root { --bg:#ffffff; --ink:#2f3b45; --muted:#6b7a86; --green:#6cc070; --pink:#f28bb3; --peach:#ffd3a8; --card:#f6f8fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100dvh; display:flex; flex-direction:column; }
  main { flex:1; display:flex; flex-direction:column; padding:28px 22px; max-width:440px; margin:0 auto; width:100%; }
  .screen { display:none; } .screen.on { display:flex; flex-direction:column; min-height:calc(100dvh - 90px); }
  .top { text-align:center; padding-top:36px; }
  h1 { font-size:30px; line-height:1.15; margin:0 0 8px; font-weight:800; }
  .sub { color:var(--muted); font-size:18px; margin:0 0 10px; }
  .alias { font-weight:800; color:var(--ink); }
  .stage { flex:1; display:grid; place-items:center; position:relative; min-height:260px; }
  .bottom { padding-bottom:12px; }
  input { width:100%; padding:15px 16px; border-radius:16px; border:2px solid #e6ebef; background:#fff; color:var(--ink); font-size:17px; margin:0 0 14px; text-align:center; }
  input:focus { outline:none; border-color:var(--pink); }
  button { width:100%; padding:17px; border:0; border-radius:18px; font-size:19px; font-weight:800; color:#fff; background:var(--green); margin:0 0 12px; box-shadow:0 5px 0 #57a35b; }
  button.secondary { background:#fff; color:var(--muted); font-weight:700; box-shadow:none; border:2px solid #e6ebef; }
  button.ok { background:var(--pink); box-shadow:0 5px 0 #d46f98; }
  button:active { transform:translateY(3px); box-shadow:none; }
  button:disabled { opacity:.45; box-shadow:none; transform:none; }
  .status { font-size:15px; color:var(--muted); min-height:1.4em; text-align:center; }
  .err { color:#d64a5a; font-size:14px; margin-top:8px; min-height:1.2em; text-align:center; }
  footer { text-align:center; color:#9aa7b1; font-size:12px; padding:12px; }
  /* welcome: eggs around a center */
  .nest { position:relative; width:280px; height:280px; }
  .nest .egg { position:absolute; font-size:44px; line-height:1; filter:saturate(.9); }
  .nest .you { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:86px; line-height:1; filter:drop-shadow(0 10px 10px rgba(0,0,0,.12)); }
  /* waiting: the egg wobbles and cracks */
  .hatch { font-size:150px; line-height:1; animation:wobble 1.6s ease-in-out infinite; transform-origin:50% 90%; filter:drop-shadow(0 12px 12px rgba(0,0,0,.12)); }
  @keyframes wobble { 0%,100% { transform:rotate(0); } 20% { transform:rotate(-7deg); } 40% { transform:rotate(6deg); } 60% { transform:rotate(-4deg); } 80% { transform:rotate(3deg); } }
  /* match found: sunburst */
  .burst { position:absolute; inset:-40% -60%; background:repeating-conic-gradient(from 0deg, #fff3e3 0deg 12deg, #ffffff 12deg 24deg); border-radius:50%; opacity:.9; animation:spin 40s linear infinite; z-index:0; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hero { position:relative; z-index:1; font-size:110px; line-height:1; filter:drop-shadow(0 12px 12px rgba(0,0,0,.12)); }
  .card { background:var(--card); border-radius:22px; padding:18px 20px; margin:0 0 14px; text-align:center; }
  .card h2 { margin:0 0 4px; font-size:22px; font-weight:800; }
  .card .where { font-size:19px; font-weight:700; }
  .card .loc { color:var(--muted); }
</style>
</head>
<body>
<main>
  <!-- 1. Welcome -->
  <section id="s-welcome" class="screen">
    <div class="top">
      <h1>Meet a stranger<br>at a booth!</h1>
      <div class="sub">We'll give you an animal name. Nothing is saved after tonight.</div>
    </div>
    <div class="stage">
      <div class="nest">
        <div class="egg" style="left:118px;top:0">🥚</div>
        <div class="egg" style="left:16px;top:60px;filter:hue-rotate(200deg)">🥚</div>
        <div class="egg" style="left:220px;top:60px;filter:hue-rotate(320deg)">🥚</div>
        <div class="egg" style="left:16px;top:170px;filter:hue-rotate(260deg)">🥚</div>
        <div class="egg" style="left:220px;top:170px;filter:hue-rotate(120deg)">🥚</div>
        <div class="egg" style="left:118px;top:232px;filter:hue-rotate(40deg)">🥚</div>
        <div class="you" id="w-mascot">🐣</div>
      </div>
    </div>
    <div class="bottom">
      <input id="w-name" placeholder="Your name (optional)" autocomplete="off">
      <button id="w-go">Enter the mix</button>
      <div class="err" id="w-err"></div>
    </div>
  </section>

  <!-- 2. Waiting -->
  <section id="s-wait" class="screen">
    <div class="top">
      <h1>Finding someone…</h1>
      <div class="sub">You're <span class="alias" id="wt-alias"></span>. <span id="wt-status"></span></div>
    </div>
    <div class="stage"><div class="hatch">🥚</div></div>
    <div class="bottom">
      <div class="status" id="wt-pool"></div>
      <div class="err" id="wt-err"></div>
    </div>
  </section>

  <!-- 3. Match found -->
  <section id="s-card" class="screen">
    <div class="top">
      <h1 id="c-title">You matched!</h1>
      <div class="sub" id="c-status">Both of you have to say yes.</div>
    </div>
    <div class="stage"><div class="burst"></div><div class="hero" id="c-mascot">🦊</div></div>
    <div class="bottom">
      <div class="card">
        <div class="where" id="c-vendor"></div>
        <div class="loc" id="c-loc"></div>
      </div>
      <button id="c-yes">I'm in!</button>
      <button id="c-pass" class="secondary">Pass, find another</button>
      <div class="err" id="c-err"></div>
    </div>
  </section>

  <!-- 4. At the booth -->
  <section id="s-booth" class="screen">
    <div class="top">
      <h1 id="b-title">It's on!</h1>
      <div class="sub">Head over and say hi.</div>
    </div>
    <div class="stage"><div class="burst"></div><div class="hero">🎉</div></div>
    <div class="bottom">
      <div class="card">
        <div class="where" id="b-vendor"></div>
        <div class="loc" id="b-loc"></div>
      </div>
      <button id="b-self" class="ok">I'm at the booth</button>
      <button id="b-partner" class="ok">My match showed up</button>
      <div class="status" id="b-status"></div>
      <button id="b-again" class="secondary">Find someone new</button>
      <div class="err" id="b-err"></div>
    </div>
  </section>
</main>
<footer>Pop · anonymous · nothing persists after tonight</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const cfg = window.POP_CONFIG;
  const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const $ = id => document.getElementById(id);
  const show = name => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $('s-' + name).classList.add('on'); };
  const TIMEOUT_MS = 10 * 60 * 1000, POLL_MS = 3000;
  const ANIMAL = { Otter:'🦦', Heron:'🪶', Lynx:'🐱', Falcon:'🦅', Fox:'🦊', Badger:'🦡', Ibis:'🦩', Marten:'🐾', Puffin:'🐧', Stoat:'🐿️', Wren:'🐦', Yak:'🐂' };
  const emojiFor = alias => ANIMAL[(alias || '').split(' ').pop()] || '🫧';
  let me = null, match = null, pollTimer = null, cardTimer = null;

  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw new Error(error.message); return data; };
  const stopPolls = () => { clearInterval(pollTimer); clearTimeout(cardTimer); pollTimer = cardTimer = null; };
  const err = (id, e) => { $(id).textContent = e ? (e.message || String(e)) : ''; };

  // ---- identity: anonymous session persisted in this browser ----
  async function session() {
    let { data: { session } } = await sb.auth.getSession();
    if (!session) ({ data: { session } } = await sb.auth.signInAnonymously());
    if (!session) throw new Error('could not sign in');
    return session;
  }

  // ---- 1. welcome ----
  async function boot() {
    try {
      await session();
      // already joined on this device? then jump straight back in
      const { data: rows } = await sb.from('people').select('*').limit(1);
      if (rows && rows[0]) { me = rows[0]; return search(); }
      show('welcome');
    } catch (e) { show('welcome'); err('w-err', e); }
  }
  $('w-go').onclick = async () => {
    $('w-go').disabled = true; err('w-err');
    try { me = await rpc('join_event', { p_name: $('w-name').value || null }); search(); }
    catch (e) { err('w-err', e); $('w-go').disabled = false; }
  };

  // ---- 2. waiting / search ----
  async function search() {
    stopPolls(); match = null;
    $('wt-alias').textContent = (me.name || me.alias); $('wt-status').textContent = me.variant === 'A' ? 'We\'ll pair you with someone else in the mix.' : 'Finding you a booth.';
    show('wait');
    const tick = async () => {
      try {
        const m = await rpc('find_match');
        if (m && m.id) { stopPolls(); match = m; return card(); }
        const n = await rpc('pool_size');            // includes you
        const others = Math.max(0, (n || 1) - 1);
        $('wt-pool').textContent = others === 0 ? 'You\'re the first one here. Hang tight.' : (others === 1 ? '1 other person is nearby.' : others + ' other people are nearby.');
      } catch (e) { err('wt-err', e); }
    };
    await tick();
    if (!match) pollTimer = setInterval(tick, POLL_MS);
  }

  // ---- 3. the card ----
  async function card() {
    err('c-err'); $('c-yes').disabled = false;
    const c = await rpc('match_card', { p_match: match.id });
    renderCard(c);
    show('card');
    // if nobody acts in 10 minutes, time out and go back to the mix
    cardTimer = setTimeout(async () => { try { await rpc('respond_to_match', { p_match: match.id, p_action: 'timed_out' }); } catch (_) {} search(); }, TIMEOUT_MS);
    // watch the partner's answer
    pollTimer = setInterval(async () => {
      try {
        const c2 = await rpc('match_card', { p_match: match.id });
        const other = c2.my_slot === 1 ? c2.status_2 : c2.status_1;
        const mine  = c2.my_slot === 1 ? c2.status_1 : c2.status_2;
        if (other === 'passed' || other === 'timed_out') { $('c-status').textContent = 'They passed. Finding someone else…'; return setTimeout(search, 1200); }
        if (mine === 'confirmed' && (other === 'confirmed' || c2.partner_alias == null)) { stopPolls(); return booth(c2); }
        if (mine === 'confirmed') $('c-status').textContent = 'You\'re in. Waiting for ' + c2.partner_alias + '…';
      } catch (e) { err('c-err', e); }
    }, POLL_MS);
  }
  function renderCard(c) {
    $('c-mascot').textContent = c.partner_alias ? emojiFor(c.partner_alias) : '📍';
    $('c-title').textContent = c.partner_alias ? ('You matched with ' + c.partner_alias + '!') : 'Head to the booth!';
    $('c-vendor').textContent = c.vendor_name; $('c-loc').textContent = c.vendor_location;
    $('c-status').textContent = c.partner_alias ? 'Both of you have to say yes.' : '';
  }
  $('c-yes').onclick = async () => {
    $('c-yes').disabled = true; err('c-err');
    try {
      const m = await rpc('respond_to_match', { p_match: match.id, p_action: 'confirmed' });
      const solo = !m.person_2;
      if (solo || (m.status_1 === 'confirmed' && m.status_2 === 'confirmed')) { stopPolls(); booth(await rpc('match_card', { p_match: match.id })); }
      else $('c-status').textContent = 'You\'re in. Waiting for your match…';
    } catch (e) { err('c-err', e); $('c-yes').disabled = false; }
  };
  $('c-pass').onclick = async () => {
    err('c-err');
    try { await rpc('respond_to_match', { p_match: match.id, p_action: 'passed' }); } catch (e) { return err('c-err', e); }
    search();
  };

  // ---- 4. at the booth ----
  function booth(c) {
    stopPolls();
    $('b-title').textContent = c.partner_alias ? ('It\'s on with ' + c.partner_alias + '!') : 'It\'s on!';
    $('b-vendor').textContent = c.vendor_name; $('b-loc').textContent = c.vendor_location;
    $('b-partner').style.display = c.partner_alias ? '' : 'none';
    $('b-self').disabled = !!c.self_at; $('b-partner').disabled = !!c.partner_at;
    $('b-status').textContent = ''; err('b-err');
    show('booth');
  }
  $('b-self').onclick = async () => { try { await rpc('check_in', { p_match: match.id, p_kind: 'self' }); $('b-self').disabled = true; $('b-status').textContent = 'Checked in. Have fun.'; } catch (e) { err('b-err', e); } };
  $('b-partner').onclick = async () => { try { await rpc('check_in', { p_match: match.id, p_kind: 'partner' }); $('b-partner').disabled = true; $('b-status').textContent = 'Nice. Thanks for confirming.'; } catch (e) { err('b-err', e); } };
  $('b-again').onclick = async () => { try { await rpc('respond_to_match', { p_match: match.id, p_action: 'passed' }); } catch (_) {} search(); };

  boot();
})();
</script>
</body>
</html>
